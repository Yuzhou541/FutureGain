[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "future-gain"
version = "0.1.0"
description = "Fixed-budget future-gain calibration for frozen autoregressive video prediction"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
future-gain = "future_gain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
